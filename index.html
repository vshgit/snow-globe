<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Снежный шар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Одна ночная сцена во весь экран: холст, поверх него подсказка и две тихие круглые кнопки. */
  --night:#050817;
  --ink:#0a0e20;
  --amber:#ffb85c;
  --amber-soft:#ffd9a0;
  --snow:#e9eeff;
  --line:rgba(255,217,160,.3);
  --font-display:'Poiret One','Century Gothic','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--amber-soft);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-display);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 46%,rgba(3,4,12,0) 52%,rgba(3,4,12,.6) 100%)}

#hint{position:fixed;left:0;right:0;top:74%;margin:0;text-align:center;pointer-events:none;
  font-size:clamp(20px,5.8vw,30px);letter-spacing:.5em;text-indent:.5em;color:var(--amber-soft);
  text-shadow:0 0 18px rgba(255,184,92,.6),0 0 2px rgba(255,184,92,.4);
  animation:breathe 3.2s ease-in-out infinite;transition:opacity .9s ease}
body.started #hint{opacity:0;animation:none}
@keyframes breathe{0%,100%{opacity:.38}50%{opacity:1}}

.ctl{position:fixed;display:grid;place-items:center;padding:0;border-radius:50%;
  border:1px solid var(--line);background:rgba(10,14,32,.58);color:var(--amber-soft);
  opacity:0;pointer-events:none;cursor:pointer;touch-action:none;
  transition:opacity 1.4s ease,transform .25s ease,box-shadow .35s ease,background .35s ease;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.inside .ctl{opacity:1;pointer-events:auto}
.ctl:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.ctl svg{display:block;pointer-events:none}
#sound{right:16px;top:16px;width:44px;height:44px}
#sound .off{display:none}
#sound.muted .on{display:none}
#sound.muted .off{display:inline}
#sound.muted{color:rgba(255,217,160,.55)}
#snow{right:18px;bottom:20px;width:58px;height:58px}
#snow.held{background:rgba(255,184,92,.24);box-shadow:0 0 30px rgba(255,184,92,.5);transform:scale(1.1)}
#snow.held svg{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#tip{position:fixed;right:88px;bottom:36px;padding:7px 14px 8px;border-radius:999px;white-space:nowrap;
  font-size:15px;letter-spacing:.14em;color:var(--amber-soft);background:rgba(10,14,32,.62);border:1px solid rgba(255,217,160,.18);
  opacity:0;pointer-events:none;transition:opacity .7s ease}
#tip.show{opacity:1}
@media (hover:hover){body.inside #snow:hover ~ #tip{opacity:1}}
body.inside #snow:focus-visible ~ #tip{opacity:1}
@media (prefers-reduced-motion:reduce){#hint{animation:none;opacity:.9}#snow.held svg{animation:none}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" role="img" aria-label="Снежный шар. Внутри парижский дом ночью, идёт снег. Окна зажигаются по касанию."></canvas>
<div id="vignette"></div>
<p id="hint">коснись</p>

<button id="sound" class="ctl" type="button" aria-label="Звук" aria-pressed="true">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
    <g class="on"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/></g>
    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
  </svg>
</button>
<button id="snow" class="ctl" type="button" aria-label="Снегопад: нажми и держи" aria-describedby="tip">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
    <g id="arm"><path d="M12 12V2.8M12 5.4 9.9 3.7M12 5.4l2.1-1.7M12 8.3l-1.7-1.4M12 8.3l1.7-1.4"/></g>
    <use href="#arm" transform="rotate(60 12 12)"/><use href="#arm" transform="rotate(120 12 12)"/>
    <use href="#arm" transform="rotate(180 12 12)"/><use href="#arm" transform="rotate(240 12 12)"/>
    <use href="#arm" transform="rotate(300 12 12)"/>
  </svg>
</button>
<span id="tip" role="tooltip">потряси или зажми</span>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  МУЗЫКА. Когда появится файл с джазом, впишите сюда его адрес
 *  (data:-ссылку или файл самого артефакта) — синтезатор отключится.
 * ------------------------------------------------------------------ */
const MUSIC_URL = '';

const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d', { alpha: false });
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======================= геометрия мира ========================== *
 * Единицы условные. y = 0 — тротуар, вверх — отрицательные значения. */
const BX0 = -170, BX1 = 170, BW = 340;
const FLOORS = [            // низ этажа, высота окна, сплошной балкон
  { b: -112, wh: 86, cont: true },
  { b: -220, wh: 80, cont: false },
  { b: -322, wh: 80, cont: false },
  { b: -424, wh: 70, cont: true },
];
const CORN = -516, MANS_TOP = -600;
const BAYS = [-108, 0, 108], WW = 58;
const GLOBE = { x: 0, y: -312, r: 432 };
const MOON = { x: -112, y: -702, r: 23 };
const EIF = { x: 186, base: -580, h: 140 };         /* башня вдали, правее трубы, за крышей соседнего дома */
const eifHalf = f => .19*Math.exp(-3.6*f)*EIF.h;      /* полуширина на доле высоты f */
const eifInner = f => f >= .35 ? 0 : f < .173 ? lerp(.58, .5, f/.173) : lerp(.5, .16, (f - .173)/.177);
const eifY = f => EIF.base - f*EIF.h;
const SKY_TOP = -586;
const skyline = [];                                  /* профиль дальних крыш — для обрезки блеска башни */                                /* верх дальнего ряда крыш (самый низкий) */
const SCENE_W = 420, SCENE_H = 802, SCENE_BOTTOM = 62;

/* окна */
const wins = [];
function addWin(o){
  wins.push(Object.assign({ shape:'rect', light:0, target:0, pin:0, pulse:0, flip:false, hero:false,
    ph: Math.random()*60, room: wins.length % 3, curtain: wins.length % 3, rail:null }, o));
}
const PLAN = [
  ['lamp*', 'chandelier', 'plant*'],
  ['reader*', 'couple', 'tree'],
  ['pianist', 'lamp', 'cat*'],
  ['cat', 'plant', 'reader'],
];
FLOORS.forEach((f, fi) => BAYS.forEach((bx, bi) => {
  const name = PLAN[fi][bi], flip = name.endsWith('*');
  const y = f.b - 5 - f.wh, x = bx - WW/2;
  const rail = f.cont
    ? { x: BX0 + 7, y: f.b - 5 - 21, w: BW - 14, h: 21, orn: true }
    : { x: x - 5, y: f.b - 5 - 15, w: WW + 10, h: 15, orn: false };
  addWin({ x, y, w: WW, h: f.wh, scene: name.replace('*',''), flip, rail, floor: fi, hero: name === 'couple' });
}));
addWin({ x:-20, y:-584, w:40, h:50, scene:'easel', curtain:2 });
addWin({ x:-124, y:-576, w:32, h:32, shape:'round', scene:'none', curtain:2 });
addWin({ x:92, y:-576, w:32, h:32, shape:'round', scene:'none', curtain:2 });
addWin({ x:-139, y:-94, w:62, h:82, shape:'arch', scene:'cafe', curtain:2 });
addWin({ x:77, y:-94, w:62, h:82, shape:'arch', scene:'cafe', curtain:2, flip:true });
const farWins = [];
const shops = [], neighChim = [], shopCount = [0, 0];
let shopOld = new Map();
function shopPath(g, sh){ const r = sh.w/2; g.beginPath(); g.moveTo(sh.x, 0); g.lineTo(sh.x, -sh.h + r); g.arc(sh.x + r, -sh.h + r, r, Math.PI, 0); g.lineTo(sh.x + sh.w, 0); g.closePath(); }
let farOld = new Map();
const farKey = f => Math.round(f.x) + '|' + Math.round(f.y);
function addFar(o, lit){ const old = farOld.get(farKey(o)); o.target = old !== undefined ? old : (lit ? 1 : 0); o.light = o.target; o.pin = 0; o.vis = false; farWins.push(o); }

/* ======================= состояние =============================== */
let W = 0, H = 0, dpr = 1, dprCap = 2;
let V = { s0:.3, s1:1, c0y:0, c1y:0 };
let box = { x0:-450, y0:-760, x1:450, y1:130, w:900, h:890 };
let bg = null;                      // предрисованный слой с домом и улицей
let state = 'globe';                // globe → flying → inside
let flyT = 0, time = 0, last = 0;
let storm = 0, holding = false, lifeT = 0, farT = 2, densCap = 1, stSum = 0, stN = 0;
let cam = { s:.3, x:0, y:0 };
let roomGrad, haloGrad, glassGrad, woodGrad, brassGrad, doorSpill;
const FLY_DUR = reduceMotion ? 1.2 : 3.6;

/* ======================= спрайты ================================= */
function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mkFlake(size, rgb, kind){
  const c = mkCanvas(size, size), g = c.getContext('2d'), r = size/2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  if (kind === 0){ gr.addColorStop(0,`rgba(${rgb},1)`); gr.addColorStop(.45,`rgba(${rgb},.85)`); gr.addColorStop(1,`rgba(${rgb},0)`); }
  else if (kind === 1){ gr.addColorStop(0,`rgba(${rgb},.9)`); gr.addColorStop(.35,`rgba(${rgb},.55)`); gr.addColorStop(1,`rgba(${rgb},0)`); }
  else { gr.addColorStop(0,`rgba(${rgb},.5)`); gr.addColorStop(.62,`rgba(${rgb},.56)`); gr.addColorStop(.84,`rgba(${rgb},.8)`); gr.addColorStop(1,`rgba(${rgb},0)`); }
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const FL = [ mkFlake(16,'236,241,255',0), mkFlake(32,'230,236,255',1), mkFlake(64,'226,233,255',2), mkFlake(64,'255,208,150',2) ];
const glowSpr = (() => {
  const c = mkCanvas(160,160), g = c.getContext('2d');
  const gr = g.createRadialGradient(80,80,0,80,80,80);
  gr.addColorStop(0,'rgba(255,178,92,.5)'); gr.addColorStop(.28,'rgba(255,160,78,.26)');
  gr.addColorStop(.6,'rgba(255,140,64,.08)'); gr.addColorStop(1,'rgba(255,130,60,0)');
  g.fillStyle = gr; g.fillRect(0,0,160,160); return c;
})();
const rooms = [
  ['#ffdc94','#fbb559','#e88a36'], ['#ffe9b4','#f9c373','#e99a48'], ['#ffcf90','#f6a455','#dc7a38'],
].map(cols => {
  const c = mkCanvas(64,96), g = c.getContext('2d');
  let gr = g.createLinearGradient(0,0,0,96);
  gr.addColorStop(0,cols[0]); gr.addColorStop(.55,cols[1]); gr.addColorStop(1,cols[2]);
  g.fillStyle = gr; g.fillRect(0,0,64,96);
  gr = g.createRadialGradient(32,40,10,32,48,66);
  gr.addColorStop(0,'rgba(150,60,10,0)'); gr.addColorStop(1,'rgba(140,52,8,.42)');
  g.fillStyle = gr; g.fillRect(0,0,64,96); return c;
});

/* ======================= рисование: общее ======================== */
function winPath(g, w){
  g.beginPath();
  if (w.shape === 'round') g.arc(w.x + w.w/2, w.y + w.h/2, w.w/2, 0, TAU);
  else if (w.shape === 'arch'){ const r = w.w/2; g.moveTo(w.x, w.y+w.h); g.lineTo(w.x, w.y+r); g.arc(w.x+r, w.y+r, r, Math.PI, 0); g.lineTo(w.x+w.w, w.y+w.h); g.closePath(); }
  else g.rect(w.x, w.y, w.w, w.h);
}
function drawMullions(g, w, col){
  g.strokeStyle = col; g.lineCap = 'butt';
  const cx = w.x + w.w/2;
  if (w.shape === 'round'){
    const cy = w.y + w.h/2, r = w.w/2;
    g.lineWidth = 1.3; g.beginPath(); g.arc(cx, cy, r - .6, 0, TAU);
    g.moveTo(cx, cy - r); g.lineTo(cx, cy + r); g.moveTo(cx - r, cy); g.lineTo(cx + r, cy); g.stroke();
    return;
  }
  if (w.shape === 'arch'){
    const r = w.w/2, sy = w.y + r;
    g.lineWidth = 1.5; winPath(g, w); g.stroke();
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(w.x, sy); g.lineTo(w.x+w.w, sy); g.moveTo(cx, sy); g.lineTo(cx, w.y+w.h);
    for (const a of [-.9, 0, .9]){ g.moveTo(cx, sy); g.lineTo(cx + Math.sin(a)*r, sy - Math.cos(a)*r); }
    g.stroke(); return;
  }
  g.lineWidth = 1.5; g.strokeRect(w.x + .75, w.y + .75, w.w - 1.5, w.h - 1.5);
  g.lineWidth = 1.3; g.beginPath(); g.moveTo(cx, w.y); g.lineTo(cx, w.y + w.h); g.stroke();
  g.lineWidth = .8; g.beginPath();
  for (const k of [1/3, 2/3]){ g.moveTo(w.x, w.y + w.h*k); g.lineTo(w.x + w.w, w.y + w.h*k); }
  g.stroke();
}
/* кованая решётка; xa..xb — какую часть рисовать (для перерисовки поверх света) */
function drawRailing(g, x, y, w, h, orn, xa, xb){
  if (xa === undefined){ xa = x; xb = x + w; }
  xa = Math.max(xa, x); xb = Math.min(xb, x + w);
  const IRON = '#0b0e1e';
  g.strokeStyle = IRON; g.lineCap = 'butt';
  g.lineWidth = 1.6; g.beginPath(); g.moveTo(xa, y); g.lineTo(xb, y); g.stroke();
  g.lineWidth = 1.1; g.beginPath(); g.moveTo(xa, y+h-1); g.lineTo(xb, y+h-1); g.moveTo(xa, y+4.6); g.lineTo(xb, y+4.6); g.stroke();
  const n = Math.round(w/3.4), st = w/n;
  g.lineWidth = .75; g.beginPath();
  for (let i = 0; i <= n; i++){ const xx = x + i*st; if (xx < xa - .1 || xx > xb + .1) continue; g.moveTo(xx, y+4.6); g.lineTo(xx, y+h-1); }
  g.stroke();
  g.lineWidth = .6; g.beginPath();
  for (let i = 0; i < n; i++){ const xx = x + (i+.5)*st; if (xx < xa || xx > xb) continue; g.moveTo(xx+1.45, y+2.3); g.arc(xx, y+2.3, 1.45, 0, TAU); }
  g.stroke();
  if (orn){
    const m = Math.round(w/19), ms = w/m, cy = y + 4.6 + (h-5.6)/2, ry = (h-7.5)/2;
    g.lineWidth = .95; g.beginPath();
    for (let i = 0; i < m; i++){ const cx = x + (i+.5)*ms; if (cx < xa-5 || cx > xb+5) continue;
      g.moveTo(cx+4.4, cy); g.ellipse(cx, cy, 4.4, ry, 0, 0, TAU); g.moveTo(cx+1.7, cy); g.arc(cx, cy, 1.7, 0, TAU); }
    g.stroke();
  }
  g.strokeStyle = 'rgba(232,238,255,.88)'; g.lineWidth = 1.15; g.lineCap = 'round';
  g.beginPath(); g.moveTo(xa+.4, y-1.2); g.lineTo(xb-.4, y-1.2); g.stroke();
}
function snowCap(g, R, x0, x1, y, th){
  g.fillStyle = '#e4eaff'; g.beginPath(); g.moveTo(x0, y); g.lineTo(x0, y - th*.45);
  let x = x0;
  while (x < x1){ const nx = Math.min(x1, x + 5 + R()*9); g.quadraticCurveTo((x+nx)/2, y - th*(.85 + R()*.7), nx, y - th*(.4 + R()*.35)); x = nx; }
  g.lineTo(x1, y); g.closePath(); g.fill();
}

/* ======================= рисование: задник ======================= */
function buildBg(){
  const s1 = V.s1;
  let ls = s1 * dpr;
  const maxPx = W < 700 ? 3.4e6 : 6e6, area = box.w * box.h * ls * ls;
  if (area > maxPx) ls *= Math.sqrt(maxPx / area);
  const c = mkCanvas(Math.ceil(box.w*ls), Math.ceil(box.h*ls)), g = c.getContext('2d');
  g.setTransform(ls, 0, 0, ls, -box.x0*ls, -box.y0*ls);
  const R = rng(11);
  farOld = new Map(farWins.map(f => [farKey(f), f.target])); farWins.length = 0;
  shopOld = new Map(shops.map(sh => [Math.round(sh.x), sh.target])); shops.length = 0; neighChim.length = 0; shopCount[0] = shopCount[1] = 0;

  /* небо */
  let gr = g.createLinearGradient(0, box.y0, 0, 0);
  gr.addColorStop(0,'#050817'); gr.addColorStop(.3,'#0a1130'); gr.addColorStop(.68,'#161d49'); gr.addColorStop(1,'#2b2859');
  g.fillStyle = gr; g.fillRect(box.x0, box.y0, box.w, -box.y0 + 1);
  gr = g.createRadialGradient(0,-400,60,0,-400,640);
  gr.addColorStop(0,'rgba(255,168,96,.11)'); gr.addColorStop(1,'rgba(255,168,96,0)');
  g.fillStyle = gr; g.fillRect(box.x0, box.y0, box.w, -box.y0);
  g.fillStyle = '#dfe6ff';
  for (let i = 0; i < 170; i++){
    const x = box.x0 + R()*box.w, y = box.y0 + R()*(-box.y0 - 440), r = .3 + R()*R()*1.1;
    g.globalAlpha = .12 + R()*.55; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  /* луна в дымке */
  const mx = MOON.x, my = MOON.y, mr = MOON.r;
  gr = g.createRadialGradient(mx,my,8,mx,my,175);
  gr.addColorStop(0,'rgba(196,210,255,.38)'); gr.addColorStop(.3,'rgba(170,188,255,.14)'); gr.addColorStop(1,'rgba(170,188,255,0)');
  g.fillStyle = gr; g.fillRect(mx-177,my-177,354,354);
  g.save(); g.shadowColor = 'rgba(226,234,255,.95)'; g.shadowBlur = 11*ls;
  g.fillStyle = '#eef1ff'; g.beginPath(); g.arc(mx,my,mr,0,TAU); g.fill(); g.restore();
  g.fillStyle = 'rgba(150,165,220,.2)';
  for (const [dx, dy, r] of [[5.5,-3.5,5],[-6,5.5,3.8],[3,8.5,2.2],[-5,-7.5,2]]){ const q = mr/17; g.beginPath(); g.arc(mx+dx*q,my+dy*q,r*q,0,TAU); g.fill(); }

  /* башня, а перед ней — дальний ряд парижских мансард */
  drawEiffel(g);
  skyline.length = 0;
  for (let x = box.x0 - 20; x < box.x1;){
    const w = 52 + R()*46, top = SKY_TOP - R()*16, mh = 12 + R()*4;
    skyline.push({ x, w, top });
    let gg = g.createLinearGradient(0, top, 0, top + 70);
    gg.addColorStop(0,'#232c58'); gg.addColorStop(1,'#1a2148');
    g.fillStyle = gg; g.fillRect(x, top + mh, w + .6, -top - mh - 300);
    g.fillStyle = '#171e42'; g.beginPath(); g.moveTo(x, top + mh); g.lineTo(x + 4, top); g.lineTo(x + w - 4, top); g.lineTo(x + w + .6, top + mh); g.closePath(); g.fill();
    g.fillStyle = 'rgba(214,224,255,.34)'; g.fillRect(x + 4, top - .8, w - 8, 1.4);
    g.fillStyle = 'rgba(150,162,210,.22)'; g.fillRect(x, top + mh, w, 1.2);
    for (let i = 0, nd = Math.max(2, Math.round(w/18)); i < nd; i++){
      const dx = x + w*(i + .5)/nd - 2.2, lit = R() < .16;
      g.fillStyle = '#2b3564'; g.fillRect(dx - .8, top + 3, 6, 7.5);
      g.fillStyle = lit ? 'rgba(255,190,110,.75)' : '#10162f'; g.fillRect(dx, top + 4.2, 4.4, 5.6);
    }
    for (let r = 0; r < 3; r++) for (let i = 0, nw = Math.round(w/14); i < nw; i++){
      const lit = R() < .1; g.fillStyle = lit ? 'rgba(255,186,104,.6)' : 'rgba(10,14,34,.55)';
      g.fillRect(x + w*(i + .5)/nw - 2, top + mh + 6 + r*17, 4, 9);
    }
    const hasCh = R() < .8, cx = x + 6 + R()*(w - 20), chh = 8 + R()*6;
    if (hasCh && Math.abs(cx + 5 - EIF.x) > 30){
      g.fillStyle = '#2a2a48'; g.fillRect(cx, top - chh, 10, chh + 2);

}

function drawEiffel(g){
  const x = EIF.x, H = EIF.h, top = EIF.base - H;
  let gr = g.createRadialGradient(x, eifY(.5), 4, x, eifY(.5), H*.85);
  gr.addColorStop(0,'rgba(255,186,104,.2)'); gr.addColorStop(1,'rgba(255,186,104,0)');
  g.fillStyle = gr; g.fillRect(x - H, top - 50, 2*H, H + 100);
  const gold = g.createLinearGradient(0, top, 0, EIF.base);
  gold.addColorStop(0,'#ffe6b0'); gold.addColorStop(.45,'#f9bc6c'); gold.addColorStop(1,'#d88842');
  g.fillStyle = gold; g.strokeStyle = gold; g.lineJoin = 'round'; g.lineCap = 'round';
  const FS = []; for (let f = 0; f <= .9001; f += .015) FS.push(f);
  const edge = (sd, inner, fmax) => FS.filter(f => f <= fmax).forEach((f, i) => { const px = x + sd*eifHalf(f)*(inner ? eifInner(f) : 1); i ? g.lineTo(px, eifY(f)) : g.moveTo(px, eifY(f)); });
  /* полупрозрачное тело, чтобы решётка читалась */
  g.globalAlpha = .3;
  for (const sd of [-1, 1]){
    g.beginPath(); edge(sd, false, 1);
    for (let i = FS.length - 1; i >= 0; i--){ const f = FS[i]; g.lineTo(x + sd*eifHalf(f)*eifInner(f), eifY(f)); }
    g.closePath(); g.fill();
  }
  /* контуры ног и шпиля */
  g.globalAlpha = .95; g.lineWidth = .6;
  for (const sd of [-1, 1]){ g.beginPath(); edge(sd, false, 1); g.stroke(); g.beginPath(); edge(sd, true, .352); g.stroke(); }
  /* решётка: кресты между поясами */
  g.lineWidth = .42; g.globalAlpha = .8; g.beginPath();
  const X = (xa0, xb0, y0, xa1, xb1, y1) => { g.moveTo(xa0, y0); g.lineTo(xb1, y1); g.moveTo(xb0, y0); g.lineTo(xa1, y1); g.moveTo(xa1, y1); g.lineTo(xb1, y1); };
  const legF = [0, .045, .09, .135, .173, .21, .25, .29, .32, .35];
  for (let i = 0; i < legF.length - 1; i++) for (const sd of [-1, 1]){
    const a = legF[i], b = legF[i+1];
    X(x + sd*eifHalf(a), x + sd*eifHalf(a)*eifInner(a), eifY(a), x + sd*eifHalf(b), x + sd*eifHalf(b)*eifInner(b), eifY(b));
  }
  const spF = [.35, .40, .45, .50, .55, .60, .65, .70, .75, .80, .84];
  for (let i = 0; i < spF.length - 1; i++) for (const sd of [-1, 1]) X(x + sd*eifHalf(spF[i]), x, eifY(spF[i]), x + sd*eifHalf(spF[i+1]), x, eifY(spF[i+1]));
  g.moveTo(x, eifY(.35)); g.lineTo(x, eifY(.84));
  g.stroke();
  g.globalAlpha = .9; g.lineWidth = .9; g.beginPath(); g.moveTo(x - eifHalf(.02)*.58, eifY(.02)); g.quadraticCurveTo(x, eifY(.27), x + eifHalf(.02)*.58, eifY(.02)); g.stroke();
  /* площадки, кабина, купол, антенна */
  g.globalAlpha = 1;
  const deck = (f, extra, th) => { const hw = eifHalf(f) + extra; g.fillRect(x - hw, eifY(f) - th, 2*hw, th); };
  deck(.173, 1.6, 2.6); deck(.35, 1.3, 2.1); deck(.84, 1.3, 1.5);
  g.fillRect(x - 1.2, eifY(.9), 2.4, eifY(.84) - 1.5 - eifY(.9));
  g.beginPath(); g.moveTo(x - 1.2, eifY(.9)); g.quadraticCurveTo(x, eifY(.945), x + 1.2, eifY(.9)); g.fill();
  g.lineWidth = .55; g.beginPath(); g.moveTo(x, eifY(.92)); g.lineTo(x, eifY(1)); g.stroke();
  g.fillStyle = '#fff6d8';
  for (const [f, n] of [[.173, 7], [.35, 4]]){ const hw = eifHalf(f) + 1; for (let i = 0; i < n; i++){ g.beginPath(); g.arc(x - hw + 2*hw*(i + .5)/n, eifY(f) - 1.3, .55, 0, TAU); g.fill(); } }
  g.beginPath(); g.arc(x, eifY(.915), .9, 0, TAU); g.fill();
}

    for (let c = 0; c < cols; c++){
      const wx = x0 + cs*(c+.5) - 15, wh = fh*.66, wy = fb - 5 - wh;
      g.fillStyle = '#5b6184'; g.fillRect(wx - 2.5, wy - 2.5, 35, wh + 5);
      g.fillStyle = '#111732'; g.fillRect(wx, wy, 30, wh);
      g.fillStyle = 'rgba(170,178,210,.28)'; g.fillRect(wx + 14.4, wy, 1.2, wh);
      addFar({ x: wx, y: wy, w: 30, h: wh, kind: 0, cont: contB, ry: contB ? fb - 20 : fb - 16, bx: contB ? x0 + 3 + Math.ceil((wx - x0 - 3)/3.4)*3.4 : wx - 2 }, R() < .12);
      if (!contB){ g.fillStyle = '#0d1022'; g.fillRect(wx - 2, fb - 16, 34, 1.2); for (let k = 0; k <= 10; k++) g.fillRect(wx - 2 + k*3.36, fb - 16, .7, 11); }
    }

function drawWinStatic(g, w, R){
  const STONE_HI = '#aeb3cb', STONE = '#9499b4';
  if (w.shape === 'round'){
    const cx = w.x + w.w/2, cy = w.y + w.h/2, r = w.w/2;
    g.fillStyle = '#4a5580'; g.fillRect(cx - r - 7, cy + r - 2, 2*r + 14, CORN - 10 - (cy + r - 2));
    let gg = g.createLinearGradient(0, cy - r - 6, 0, cy + r + 6); gg.addColorStop(0, STONE_HI); gg.addColorStop(1,'#6f7493');
    g.fillStyle = gg; g.beginPath(); g.arc(cx, cy, r + 6, 0, TAU); g.fill();
    g.fillStyle = STONE_HI; g.fillRect(cx - 3, cy - r - 8.5, 6, 6);
    snowCap(g, R, cx - r - 2, cx + r + 2, cy - r - 4.4, 2.6);
  } else if (w.shape === 'arch'){
    const r = w.w/2;

let NP = 0, px, py, pz, pvx, pvy, pth, pph, pwarm;

let snowTop = 0;
function initSnow(){
  snowTop = box.y0 - box.h*.45;
  const n = Math.round(clamp(box.w * box.h * .0066*1.45, 3600, 10500) * (dprCap < 1.5 ? .7 : 1));
  const keep = px ? Math.min(NP, n) : 0, old = { px, py, pz, pvx, pvy, pth, pph, pwarm };   /* снег не сбрасываем при пересборке */
  NP = n;
  px = new Float32Array(n); py = new Float32Array(n); pz = new Float32Array(n); pvx = new Float32Array(n); pvy = new Float32Array(n);
  pth = new Float32Array(n); pph = new Float32Array(n); pwarm = new Uint8Array(n);
  if (keep){ px.set(old.px.subarray(0, keep)); py.set(old.py.subarray(0, keep)); pz.set(old.pz.subarray(0, keep)); pvx.set(old.pvx.subarray(0, keep)); pvy.set(old.pvy.subarray(0, keep));
    pth.set(old.pth.subarray(0, keep)); pph.set(old.pph.subarray(0, keep)); pwarm.set(old.pwarm.subarray(0, keep));
    for (let i = 0; i < keep; i++){ if (px[i] < box.x0 || px[i] > box.x1) px[i] = box.x0 + Math.random()*box.w; if (py[i] > box.y1 || py[i] < snowTop) py[i] = snowTop + Math.random()*(box.y1 - snowTop); } }
  for (let i = keep; i < n; i++){
    px[i] = box.x0 + Math.random()*box.w; py[i] = snowTop + Math.random()*(box.y1 - snowTop);
    pz[i] = Math.pow(Math.random(), 1.8); pth[i] = Math.random(); pph[i] = Math.random()*TAU; pwarm[i] = Math.random() < .3 ? 1 : 0;
  }
}
function kick(str, dx, dy){
  dx = dx || 0; dy = dy || 0;
  for (let i = 0; i < NP; i++){
    const z = pz[i], k = (80 + 230*z)*str;
    pvx[i] += (Math.random()*2 - 1)*k + dx*(.4 + z);
    pvy[i] += (Math.random()*1.35 - 1.08)*k + dy*(.4 + z);
  }
}

function stepSnow(dt){
  if (holding){ storm = Math.min(1, storm + dt*1.8); kick(dt*2.6); }
  else storm *= Math.exp(-dt/4.2);
  const damp = Math.exp(-dt*1.5);
  const wind = Math.sin(time*.23)*6 + storm*Math.sin(time*.9)*40;
  const fallK = 1 + storm*.9;
  for (let i = 0; i < NP; i++){
    const z = pz[i];
    px[i] += (wind*(.4 + z) + Math.sin(time*(.6 + z) + pph[i])*(5 + 9*z) + pvx[i])*dt;
    py[i] += ((15 + 58*z)*fallK + pvy[i])*dt;

    else if (py[i] < snowTop){ py[i] = snowTop + Math.random()*(box.y0 - snowTop); pvy[i] = 0; }

/* --- пасхалка: сапог Санты в трубе --- */

function drawLamps(dt){

function buildGlobeGradients(){
  const { x, y, r } = GLOBE;
  roomGrad = ctx.createRadialGradient(x, y + r*1.05, r*.2, x, y + r*.6, r*3.4);
  roomGrad.addColorStop(0,'#241a2a'); roomGrad.addColorStop(.3,'#11111f'); roomGrad.addColorStop(1,'#05060e');
  haloGrad = ctx.createRadialGradient(x, y, r*.95, x, y, r*1.7);
  haloGrad.addColorStop(0,'rgba(255,176,96,.16)'); haloGrad.addColorStop(1,'rgba(255,176,96,0)');
  glassGrad = ctx.createRadialGradient(x, y, r*.62, x, y, r);
  glassGrad.addColorStop(0,'rgba(6,10,30,0)'); glassGrad.addColorStop(.8,'rgba(6,10,30,.22)'); glassGrad.addColorStop(1,'rgba(4,8,26,.7)');
  woodGrad = ctx.createLinearGradient(x - r*.8, 0, x + r*.8, 0);
  woodGrad.addColorStop(0,'#160b07'); woodGrad.addColorStop(.3,'#5a3320'); woodGrad.addColorStop(.52,'#3c2115'); woodGrad.addColorStop(1,'#0e0705');
  brassGrad = ctx.createLinearGradient(x - r*.7, 0, x + r*.7, 0);
  doorSpill = ctx.createLinearGradient(0, -4, 0, 25); doorSpill.addColorStop(0,'rgba(255,184,100,.36)'); doorSpill.addColorStop(1,'rgba(255,184,100,0)');
  brassGrad.addColorStop(0,'#4a3312'); brassGrad.addColorStop(.3,'#ecc67a'); brassGrad.addColorStop(.55,'#a87c34'); brassGrad.addColorStop(1,'#3a280e');
}
function drawGlobeShell(a){

  ctx.beginPath(); ctx.rect(x - 9000, y - 9000, 18000, 18000); ctx.arc(x, y, r, 0, TAU, true);
  ctx.fillStyle = roomGrad; ctx.fill('evenodd');
  ctx.fillStyle = haloGrad; ctx.fill('evenodd');
  /* стол и отсвет на нём */
  const ty = y + r*.87, by = y + r*1.2, tw = r*.66, bw = r*.8;
  let gr = ctx.createRadialGradient(x, by + r*.06, r*.1, x, by + r*.06, r*1.5);
  gr.addColorStop(0,'rgba(255,170,96,.2)'); gr.addColorStop(1,'rgba(255,170,96,0)');
  ctx.fillStyle = gr; ctx.save(); ctx.translate(x, by + r*.06); ctx.scale(1, .12); ctx.translate(-x, -(by + r*.06));
  ctx.beginPath(); ctx.arc(x, by + r*.06, r*1.5, 0, TAU); ctx.fill(); ctx.restore();

  ctx.fillStyle = glassGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  gr = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  gr.addColorStop(0,'rgba(255,255,255,.5)'); gr.addColorStop(.45,'rgba(200,214,255,.12)'); gr.addColorStop(1,'rgba(255,200,140,.26)');
  ctx.strokeStyle = gr; ctx.lineWidth = r*.012; ctx.beginPath(); ctx.arc(x, y, r - r*.006, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.075)'; ctx.beginPath();
  ctx.arc(x, y, r*.92, Math.PI*1.1, Math.PI*1.4); ctx.arc(x + r*.035, y + r*.035, r*.9, Math.PI*1.4, Math.PI*1.1, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.beginPath(); ctx.ellipse(x - r*.57, y - r*.6, r*.055, r*.022, -.8, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,214,160,.07)'; ctx.beginPath();
  ctx.arc(x, y, r*.93, Math.PI*.12, Math.PI*.36); ctx.arc(x - r*.05, y - r*.05, r*.9, Math.PI*.36, Math.PI*.12, true); ctx.closePath(); ctx.fill();

  ctx.lineWidth = r*.012; ctx.beginPath(); ctx.moveTo(x - bw*.985, by - r*.035); ctx.quadraticCurveTo(x, by + r*.05, x + bw*.985, by - r*.035); ctx.stroke();

/* ======================= размер и камера ========================= */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const R = Math.min(W*.37, H*.265);
  V.s0 = R / GLOBE.r; V.s1 = Math.min(W/SCENE_W, H/SCENE_H);
  V.c0y = GLOBE.y + (H*.5 - H*.45)/V.s0;
  V.c1y = SCENE_BOTTOM - (H/2)/V.s1;
  const hx = Math.max(GLOBE.r + 12, W/2/V.s1 + 14);
  box.x0 = -hx; box.x1 = hx;
  box.y0 = Math.min(GLOBE.y - GLOBE.r - 14, V.c1y - H/2/V.s1 - 14);
  box.y1 = GLOBE.y + GLOBE.r + 14;
  box.w = box.x1 - box.x0; box.h = box.y1 - box.y0;
  layoutLamps(); buildBg(); buildGlobeGradients(); initSnow();
  const hintY = (GLOBE.y + GLOBE.r*1.29 - V.c0y)*V.s0 + H/2;
  document.getElementById('hint').style.top = Math.min(H - 60, hintY + 22) + 'px';
}
function setCam(e){
  const s = V.s0 * Math.pow(V.s1/V.s0, e);
  const f = Math.abs(V.s1 - V.s0) < 1e-6 ? e : (1/V.s0 - 1/s) / (1/V.s0 - 1/V.s1);
  cam.s = s; cam.x = 0; cam.y = lerp(V.c0y, V.c1y, f);
}

/* ======================= кадр ==================================== */
let perfN = 0, perfSum = 0, perfStage = 0, needResize = false;
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden){ last = now; return; }
  const dtRaw = (now - last)/1000; last = now;
  const dt = Math.min(.05, Math.max(0, dtRaw));
  time += dt;
  /* размер меняем прямо перед отрисовкой кадра — иначе между очисткой холста и новым кадром мелькает пустой экран */
  if (needResize){ needResize = false; const w = window.innerWidth, h = window.innerHeight; if (w > 0 && h > 0 && (w !== W || h !== H || Math.min(window.devicePixelRatio || 1, dprCap) !== dpr)) resize(); }

  let e = 0;
  if (state === 'flying'){ flyT += dt/FLY_DUR; if (flyT >= 1){ flyT = 1; arrive(); } e = ease(flyT); }
  else if (state === 'inside') e = 1;
  setCam(e);
  if (state === 'globe' && !reduceMotion) cam.s *= 1 + .006*Math.sin(time*.8);

  /* свет */
  const kL = 1 - Math.exp(-dt*6.5), kP = Math.exp(-dt*2.6);
  for (const w of wins){ w.light += (w.target - w.light)*kL; w.pulse *= kP; }
  autoLife(dt);
  stepSnow(dt);

  /* рисуем */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#050817'; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = cam.s*dpr;
  ctx.setTransform(s, 0, 0, s, (W/2 - cam.x*cam.s)*dpr, (H/2 - cam.y*cam.s)*dpr);
  ctx.fillStyle = '#141a36'; ctx.fillRect(box.x0 - 4000, box.y1 - 1, 8000 + box.w, 4000);
  ctx.drawImage(bg, box.x0, box.y0, box.w, box.h);

  drawFar(dt);
  drawShops(dt);
  drawEiffelFx(dt);
  drawSleigh(dt);
  ctx.globalAlpha = 1;
  for (const w of wins) drawLit(w, time);
  stepVisitor(dt); drawVisitor();
  drawGarlands();
  drawDoorLive(dt);
  drawLamps(dt);
  drawBoots(dt);
  drawChild();
  drawSnow();

  const shell = 1 - clamp((e - .5)/.42, 0, 1);
  if (shell > .003) drawGlobeShell(shell*shell*(3 - 2*shell));

  if (storm > .5 && dtRaw < .2){ stSum += dtRaw; stN++;
    if (stN >= 30){ if (stSum/stN > .03) densCap = Math.max(.45, densCap - .12); stSum = 0; stN = 0; } }
  /* если телефон не тянет — один раз снижаем чёткость */
  if (state === 'inside' && perfStage < 2 && dtRaw < .2){
    perfSum += dtRaw; perfN++;
    if (perfN >= 100){ const avg = perfSum/perfN; perfN = 0; perfSum = 0;
      if (avg > .026){ perfStage++; dprCap = perfStage === 1 ? 1.5 : 1; needResize = true; } else perfStage = 2; }
  }
}

/* ======================= управление ============================== */
const snowBtn = document.getElementById('snow'), soundBtn = document.getElementById('sound'), tip = document.getElementById('tip');
let tipTimer = 0, muted = false, motionArmed = false;
function hideTip(){ tip.classList.remove('show'); clearTimeout(tipTimer); }

function begin(){
  if (state !== 'globe') return;
  state = 'flying'; flyT = 0;
  document.body.classList.add('started');
  Music.start(); armMotion();
}
function arrive(){
  state = 'inside'; lifeT = 2.5;
  document.body.classList.add('started', 'inside');
  tip.classList.add('show'); clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 7000);
}
function armMotion(){
  if (motionArmed) return; motionArmed = true;
  try {
    const D = window.DeviceMotionEvent; if (!D) return;
    if (typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') addEventListener('devicemotion', onMotion); }).catch(() => {});
    else addEventListener('devicemotion', onMotion);
  } catch (err) {}
}
let lastShake = 0;
function onMotion(ev){
  if (state === 'globe') return;
  let m = 0; const a = ev.acceleration;
  if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
  else { const g = ev.accelerationIncludingGravity; if (!g || g.x == null) return; m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81); }
  const now = performance.now();
  if (m > 8 && now - lastShake > 90){ lastShake = now; shake(clamp((m - 8)/22 + .22, .22, 1)); }
}

function toWorld(cx, cy){ return { x: (cx - W/2)/cam.s + cam.x, y: (cy - H/2)/cam.s + cam.y }; }
function winAt(cx, cy){
  const p = toWorld(cx, cy);
  let best = null, bd = 1e9;
  for (const w of wins){
    const m = Math.max(7, 9/cam.s); if (p.x < w.x - m || p.x > w.x + w.w + m || p.y < w.y - m || p.y > w.y + w.h + m) continue;
    const d = Math.hypot(p.x - (w.x + w.w/2), p.y - (w.y + w.h/2)); if (d < bd){ bd = d; best = w; }
  }
  return best;
}
function hitAt(cx, cy){
  const p = toWorld(cx, cy);
  for (const l of lamps) if (Math.abs(p.x - l.x) < 11 && p.y > -108 && p.y < 12) return () => { l.target = l.target ? 0 : 1; };
  if (Math.abs(p.x) < 31 && p.y > -96 && p.y < 3) return tapDoor;
  if (Math.hypot(p.x - MOON.x, p.y - MOON.y) < Math.max(34, 30/cam.s)) return tapMoon;
  if (Math.abs(p.x - EIF.x) < 25 && p.y < SKY_TOP - 4 && p.y > EIF.base - EIF.h - 12) return tapEiffel;
  for (const sh of shops) if (p.x > sh.x - 2 && p.x < sh.x + sh.w + 2 && p.y > -sh.h - 2 && p.y < 2) return () => { sh.target = sh.target ? 0 : 1; };
  for (const b of boots) if (p.x > b.cx - 5 && p.x < b.cx + 49 && p.y > -682 && p.y < -598) return () => tapBoot(b);
  const w = winAt(cx, cy);
  if (w) return () => { setWin(w, !(w.target > 0)); w.pin = time + 45; };
  for (const f of farWins) if (p.x > f.x - 3 && p.x < f.x + f.w + 3 && p.y > f.y - 3 && p.y < f.y + f.h + 3) return () => { f.target = f.target ? 0 : 1; f.pin = time + 60; };
  return null;
}
let ptr = null;
cv.addEventListener('pointerdown', ev => { ptr = { id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY, t0: performance.now(), t: performance.now(), moved: 0 }; });
cv.addEventListener('pointermove', ev => {
  if (state === 'inside' && ev.pointerType === 'mouse' && !ptr) cv.style.cursor = hitAt(ev.clientX, ev.clientY) ? 'pointer' : 'default';
  if (!ptr || ev.pointerId !== ptr.id) return;
  const now = performance.now(), dx = ev.clientX - ptr.x, dy = ev.clientY - ptr.y, d = Math.hypot(dx, dy), dtm = Math.max(1, now - ptr.t);
  ptr.moved += d; ptr.x = ev.clientX; ptr.y = ev.clientY; ptr.t = now;
  if (state === 'inside' && d/dtm > .75 && ptr.moved > 30){        /* быстро водим с зажатой кнопкой — трясём шар */
    storm = Math.min(1, storm + d*.0011);
    kick(Math.min(.25, d*.0022), dx/cam.s*2.2, dy/cam.s*2.2); hideTip();
  }
});
function endPtr(ev){
  if (!ptr || ev.pointerId !== ptr.id) return;
  const tap = ptr.moved < 12 && performance.now() - ptr.t0 < 700; const p = ptr; ptr = null;
  if (tap && ev.type === 'pointerup' && state === 'inside'){
    const act = hitAt(p.x, p.y);
    if (act) act();
  }
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('click', () => { if (state === 'globe') begin(); else Music.start(); });
addEventListener('keydown', ev => { if (state === 'globe' && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); begin(); } });
cv.addEventListener('contextmenu', ev => ev.preventDefault());

function hold(on){ holding = on; snowBtn.classList.toggle('held', on); if (on){ hideTip(); kick(.45); Music.start(); } }
snowBtn.addEventListener('pointerdown', ev => { ev.preventDefault(); try { snowBtn.setPointerCapture(ev.pointerId); } catch (e) {} hold(true); });
for (const n of ['pointerup', 'pointercancel', 'lostpointercapture']) snowBtn.addEventListener(n, () => hold(false));
snowBtn.addEventListener('keydown', ev => { if ((ev.key === ' ' || ev.key === 'Enter') && !ev.repeat){ ev.preventDefault(); hold(true); } });
snowBtn.addEventListener('keyup', ev => { if (ev.key === ' ' || ev.key === 'Enter') hold(false); });
snowBtn.addEventListener('blur', () => hold(false));
snowBtn.addEventListener('contextmenu', ev => ev.preventDefault());

function setMuted(m){
  muted = m; soundBtn.classList.toggle('muted', m);
  soundBtn.setAttribute('aria-pressed', String(!m));
  soundBtn.setAttribute('aria-label', m ? 'Включить звук' : 'Выключить звук');
  Music.setMuted(m);
}
soundBtn.addEventListener('click', () => { Music.start(); setMuted(!muted); });

/* ======================= музыка ================================== *
 * Тихий синтезированный джаз: электропиано, контрабас, щётки и
 * редкие ноты вибрафона по кругу квинт. Заглушка до настоящей записи. */
const Music = (() => {
  let ac = null, master = null, bus = null, vibBus = null, noise = null, el = null;

    { r:45, f:7, v:[55,59,60,64], sc:[69,71,72,74,76,79] },   // Am9
    { r:50, f:7, v:[54,59,60,64], sc:[66,69,71,72,74,76] },   // D9
    { r:43, f:7, v:[54,57,59,62], sc:[66,67,69,71,74,78] },   // Gmaj9
    { r:48, f:7, v:[52,55,59,62], sc:[67,69,71,72,74,76] },   // Cmaj9
    { r:42, f:6, v:[52,57,60,64], sc:[69,72,74,76,78,81] },   // F#m7b5
    { r:47, f:7, v:[51,57,60,63], sc:[66,69,71,72,75,78] },   // B7b9
    { r:40, f:7, v:[50,54,55,59], sc:[66,67,69,71,74,76] },   // Em9
    { r:40, f:7, v:[50,56,60,62], sc:[68,71,72,74,76,80] },   // E7b13
  ];

    const f = mtof(m), o = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();

    mg.gain.setValueAtTime(f*1.3*vel, t); mg.gain.setTargetAtTime(f*.12, t, .22);
    mod.connect(mg); mg.connect(o.frequency);
    const pk = .05*vel;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + .012);
    g.gain.setTargetAtTime(pk*.36, t + .012, .3); g.gain.setTargetAtTime(0, t + dur, .32);
    o.connect(g); g.connect(bus);

    const pk = .17*vel;

    g.gain.setTargetAtTime(pk*.32, t + .016, .32); g.gain.setTargetAtTime(0, t + dur, .1);
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(bus);
    o.start(t); o2.start(t); o.stop(t + dur + 1); o2.stop(t + dur + 1);
  }
  function vib(t, m, vel){
    const f = mtof(m), o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain(), g = ac.createGain();
    o.frequency.value = f; o2.frequency.value = f*4;
    g2.gain.setValueAtTime(.16, t); g2.gain.setTargetAtTime(0, t, .09);
    const pk = .06*vel;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + .006); g.gain.setTargetAtTime(0, t + .006, .75);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(vibBus);
    o.start(t); o2.start(t); o.stop(t + 4.5); o2.stop(t + 1);
  }
  function brush(t, dur, vel){
    const s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = .6;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + dur*.35); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(bp); bp.connect(g); g.connect(bus);
    s.start(t, Math.random()*1.5); s.stop(t + dur + .02);
  }
  const at = (t0, k) => t0 + Math.floor(k/2)*BEAT + (k % 2 ? SWING*BEAT : 0);
  const hit = (t, c, dur, vel) => c.v.forEach((m, i) => ep(t + i*.013, m, dur, vel*(.85 + Math.random()*.3)));
  function scheduleBar(t0, n){
    const c = CH[n % 8], nx = CH[(n + 1) % 8];
    hit(at(t0, 0), c, 1.9*BEAT, .9);
    const r = Math.random();
    if (r < .4) hit(at(t0, 3), c, .7*BEAT, .6); else if (r < .65) hit(at(t0, 5), c, .9*BEAT, .6);
    if (Math.random() < .3) hit(at(t0, 7), nx, .4*BEAT, .5);
    bass(at(t0, 0), c.r, 1.7*BEAT, 1);
    bass(at(t0, 4), c.r + (Math.random() < .75 ? c.f : 12), 1.3*BEAT, .85);
    if (Math.random() < .5) bass(at(t0, 7), nx.r + (Math.random() < .5 ? 1 : -1), .35*BEAT, .7);
    for (let k = 0; k < 8; k++) brush(at(t0, k), k % 2 ? .12 : .24, (k === 2 || k === 6) ? .05 : .02);
    if (Math.random() < .68){
      let k = Math.random()*5 | 0, idx = 1 + (Math.random()*4 | 0), cnt = 2 + (Math.random()*3 | 0);
      while (cnt-- > 0 && k < 8){
        vib(at(t0, k), c.sc[idx], .65 + Math.random()*.35);
        idx = clamp(idx + [-2,-1,1,1,2][Math.random()*5 | 0], 0, 5);
        k += Math.random() < .6 ? 1 : 2;
      }
    }
  }
  function tick(){
    if (!ac || ac.state !== 'running') return;
    if (nextBar < ac.currentTime) nextBar = ac.currentTime + .08;
    while (nextBar < ac.currentTime + .4){ scheduleBar(nextBar, bar); nextBar += 4*BEAT; bar++; }
  }
  function start(){
    if (started){ if (ac && ac.state === 'suspended' && !document.hidden) ac.resume().catch(() => {}); return; }
    started = true;
    try {
      if (MUSIC_URL){
        el = new Audio(MUSIC_URL); el.loop = true; el.volume = 0; el.muted = isMuted;
        el.play().catch(() => {});
        let v = 0; const iv = setInterval(() => { v = Math.min(.55, v + .02); el.volume = v; if (v >= .55) clearInterval(iv); }, 120);
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0;
      const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5600;
      master.connect(tone); tone.connect(ac.destination);
      bus = ac.createGain(); bus.connect(master);
      /* простая реверберация из затухающего шума */
      const len = Math.floor(ac.sampleRate*2.3), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 2.6); }
      const conv = ac.createConvolver(); conv.buffer = ir; const wet = ac.createGain(); wet.gain.value = .3;
      bus.connect(conv); conv.connect(wet); wet.connect(master);
      vibBus = ac.createGain(); vibBus.gain.value = .85; vibBus.connect(bus);
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 4.6; lg.gain.value = .15; lfo.connect(lg); lg.connect(vibBus.gain); lfo.start();
      noise = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
      const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
      ac.resume().catch(() => {});
      master.gain.setTargetAtTime(isMuted ? 0 : VOL, ac.currentTime + .2, 1.3);
      nextBar = ac.currentTime + .5;
      setInterval(tick, 90);
    } catch (err) { ac = null; }
  }
  function setMuted(m){
    isMuted = m;
    if (el) el.muted = m;
    if (ac && master) master.gain.setTargetAtTime(m ? 0 : VOL, ac.currentTime, .12);
  }
  document.addEventListener('visibilitychange', () => {
    if (el){ if (document.hidden) el.pause(); else if (started) el.play().catch(() => {}); }
    if (ac){ if (document.hidden) ac.suspend().catch(() => {}); else ac.resume().catch(() => {}); }
  });
  function chime(notes, gap, vel){ if (!ac || ac.state !== 'running') return; const t = ac.currentTime + .03; notes.forEach((m, i) => vib(t + i*gap, m, vel || .55)); }
  const bells = () => chime([88,91,88,95,91,96], .11);
  return { start, setMuted, bells, chime };
})();

/* ======================= запуск ================================== */
function start(data){
  /* дом уже живёт, пока мы смотрим на шар снаружи */
  wins.forEach(w => { const on = w.hero || Math.random() < .34; w.target = on ? 1 : 0; w.light = w.target; });
  resize();
  if (data && data.inside){ state = 'inside'; document.body.classList.add('started', 'inside'); }
  if (data && data.muted) setMuted(true);
  let rz = 0;
  const later = () => { clearTimeout(rz); rz = setTimeout(() => { needResize = true; }, 160); };
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (window.visualViewport) visualViewport.addEventListener('resize', later);
  setInterval(() => { if (window.innerWidth !== W || window.innerHeight !== H) later(); }, 400);   /* поворот экрана не всегда присылает resize */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  last = performance.now();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ inside: state !== 'globe', muted }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

window.__snowglobe = { wins, begin, shake, lamps, boots, door, visitor, farWins, shops, sleighs, tapDoor, tapBoot, tapMoon, tapEiffel, get state(){ return state; } };
})();
